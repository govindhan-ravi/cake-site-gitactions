sonar.projectKey=cake-site
sonar.organization=govindhan-ravi
sonar.projectName=SP Cakes & Delight
sonar.projectVersion=1.0

# Source directories
sonar.sources=src
sonar.exclusions=**/node_modules/**,**/build/**,**/*.test.js,**/*.spec.js

# Test directories
sonar.tests=src
sonar.test.inclusions=**/*.test.js,**/*.spec.js

# Coverage reports (generated by 'npm test -- --coverage')
sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.language=js
sonar.sourceEncoding=UTF-8
