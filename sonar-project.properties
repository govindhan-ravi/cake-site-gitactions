sonar.projectKey=govindhan-ravi_cake-site-gitactions
sonar.organization=govindhan-ravi
sonar.projectName=cake-site-gitactions
sonar.projectVersion=1.0
sonar.qualitygate.wait=true


# Source directories
sonar.sources=src
sonar.exclusions=**/node_modules/**,**/build/**,**/*.test.js,**/*.spec.js

# Test directories
sonar.tests=src
sonar.test.inclusions=**/*.test.js,**/*.spec.js

# Coverage reports (generated by 'npm test -- --coverage')
sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.language=js
sonar.sourceEncoding=UTF-8
